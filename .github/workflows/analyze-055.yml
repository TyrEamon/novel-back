name: analyze-055

on:
  workflow_dispatch:
  push:
    branches: [port055]

concurrency:
  group: analyze-055-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          echo "exit=$?"
          tail -n 60 analyze.txt
          exit 0

      - name: Summarize errors
        if: always()
        run: |
          grep -E "^\s*(error|warning)" analyze.txt | sed 's/^[[:space:]]*//' | sort | uniq -c | sort -rn | head -n 120 || true
          echo "---- total error lines ----"
          grep -cE "^\s*error" analyze.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analyze-055
          path: analyze.txt
          retention-days: 7