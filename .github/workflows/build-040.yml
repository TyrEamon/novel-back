name: build-0.4.0

# Builds a self-signed release APK from the v0.4.0 snapshot (the last version
# that still ships the legado-compatible book-source engine).
# The published snapshot has no android/gradlew, so the wrapper is regenerated
# here. Without android/key.properties the release build falls back to the
# debug keystore (see android/app/build.gradle.kts:108-110).

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-040-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.41.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true

      - name: Restore Gradle wrapper (omitted from the published snapshot)
        run: |
          set -euo pipefail
          # Generate the wrapper in an isolated directory. Running `gradle wrapper`
          # inside android/ makes the runner's stock Gradle parse this project's
          # AGP 8.11.1 / Kotlin 2.2.20 build scripts first, which fails whenever the
          # preinstalled Gradle major differs from the wrapper's 8.14.
          mkdir -p /tmp/wrapgen && cd /tmp/wrapgen
          if command -v gradle >/dev/null 2>&1; then
            gradle wrapper --gradle-version 8.14 --distribution-type all
          else
            curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.14/bin/gradle wrapper --gradle-version 8.14 --distribution-type all
          fi
          cp -f /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat "$GITHUB_WORKSPACE/android/"
          cp -rf /tmp/wrapgen/gradle/. "$GITHUB_WORKSPACE/android/gradle/"
          chmod +x "$GITHUB_WORKSPACE/android/gradlew"
          ls -l "$GITHUB_WORKSPACE/android/gradlew" "$GITHUB_WORKSPACE/android/gradle/wrapper/"

      - name: Install NDK 28.2.13676358 and CMake 3.22.1
        run: |
          set -euo pipefail
          SDKMAN="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMAN" --install "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
          ls "$ANDROID_SDK_ROOT/ndk"

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK (arm64-v8a)
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          ls -l build/app/outputs/flutter-apk/

      - name: Checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wenku8-0.4.0-arm64-v8a
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30